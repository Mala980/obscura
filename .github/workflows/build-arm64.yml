name: Build Linux ARM64

on:
  push:
    branches: [engine]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  build-arm64:
    name: Build / Linux ARM64
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake libclang-dev libssl-dev llvm-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@v2
        with:
          key: arm64-linux

      - name: Build full release (ARM64)
        run: cargo build --release --target aarch64-unknown-linux-gnu -p obscura-cli --bins --features render,stealth,websocket,canvas2d

      - name: Smoke test release binary
        shell: bash
        run: |
          BIN=target/aarch64-unknown-linux-gnu/release/obscura
          "$BIN" fetch "data:text/html,<title>ok</title>" --eval "1+1"
          echo "Smoke test passed"

      - name: Package binaries
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          BIN_DIR=target/aarch64-unknown-linux-gnu/release
          tar czf obscura-${VERSION}-aarch64-linux-full.tar.gz -C "$BIN_DIR" obscura obscura-worker

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: obscura-linux-arm64-${{ github.run_id }}
          path: obscura-*-aarch64-linux*.tar.gz
          if-no-files-found: error
          retention-days: 30

  release:
    name: Release / Linux ARM64
    needs: build-arm64
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: obscura-linux-arm64-${{ github.run_id }}
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
