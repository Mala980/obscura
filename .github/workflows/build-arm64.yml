name: Build Linux ARM64

on:
  push:
    branches: [engine]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  build-arm64:
    name: Build / Linux ARM64
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake libclang-dev libssl-dev llvm-dev pkg-config \
            libegl1 libegl-dev libgles2 libgles-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@v2
        with:
          key: arm64-linux

      - name: Build full release (ARM64)
        run: cargo build --release --target aarch64-unknown-linux-gnu -p obscura-cli --bins --features render,stealth,websocket,canvas2d,webgl-gpu,render-gpu,media

      - name: Smoke test - basic fetch
        shell: bash
        run: |
          BIN=target/aarch64-unknown-linux-gnu/release/obscura
          echo "--- HTML dump ---"
          "$BIN" fetch "data:text/html,<title>ok</title>" --dump html
          echo "--- Text dump ---"
          "$BIN" fetch "data:text/html,<title>ok</title>" --dump text
          echo "--- JS eval ---"
          RESULT=$("$BIN" fetch "data:text/html,<title>ok</title>" -e '1+1')
          echo "eval result: $RESULT"
          echo "Smoke test passed"

      - name: Test Web APIs (data URL)
        shell: bash
        continue-on-error: true
        run: |
          BIN=target/aarch64-unknown-linux-gnu/release/obscura
          FAIL=0
          check() {
            local name="$1" expr="$2"
            result=$("$BIN" fetch "data:text/html,<title>test</title>" -e "$expr" 2>/dev/null | tail -1)
            if [ "$result" = "true" ]; then
              echo "  PASS: $name"
            else
              echo "  FAIL: $name = $result (expected true)"
              FAIL=1
            fi
          }
          echo "=== Web API Tests ==="
          check "Fullscreen" "document.exitFullscreen!==undefined"
          check "PointerLock" "document.exitPointerLock!==undefined"
          check "Canvas2D" "document.createElement('canvas').getContext('2d')!==null"
          check "WebGL" "document.createElement('canvas').getContext('webgl')!==null"
          check "WebSocket" "WebSocket!==undefined"
          check "EventSource" "EventSource!==undefined"
          check "Worker" "Worker!==undefined"
          check "IndexedDB" "indexedDB!==undefined"
          check "Gamepad" "navigator.getGamepads!==undefined"
          check "Crypto" "crypto.subtle!==undefined"
          check "GPU" "navigator.gpu!==undefined"
          check "Streams" "ReadableStream!==undefined"
          check "Bluetooth" "navigator.bluetooth!==undefined"
          check "USB" "navigator.usb!==undefined"
          check "Serial" "navigator.serial!==undefined"
          check "HID" "navigator.hid!==undefined"
          check "NFC" "NDEFReader!==undefined"
          check "MIDI" "navigator.requestMIDIAccess!==undefined"
          check "Clipboard" "navigator.clipboard!==undefined"
          check "URLPattern" "URLPattern!==undefined"
          check "FontFace" "FontFace!==undefined"
          check "BarcodeDetector" "BarcodeDetector!==undefined"
          check "EyeDropper" "EyeDropper!==undefined"
          check "TextDetector" "TextDetector!==undefined"
          check "Performance" "performance.now()>0"
          echo ""
          if [ $FAIL -eq 0 ]; then echo "All Web API tests PASSED"; else echo "FAILED"; exit 1; fi

      - name: Test Stealth fingerprint
        shell: bash
        run: |
          BIN=target/aarch64-unknown-linux-gnu/release/obscura
          echo "=== Stealth Fingerprint ==="
          WD=$(timeout 15 "$BIN" fetch --stealth -e 'navigator.webdriver' https://example.com 2>/dev/null | tail -1 || echo "timeout")
          UA=$(timeout 15 "$BIN" fetch --stealth -e 'navigator.userAgent' https://example.com 2>/dev/null | tail -1 || echo "timeout")
          echo "  webdriver: $WD"
          echo "  UA: $UA"
          FAIL=0
          if [ "$WD" = "false" ]; then
            echo "  PASS: webdriver is false"
          elif [ "$WD" = "timeout" ]; then
            echo "  SKIP: fetch timed out (network issue)"
          else
            echo "  FAIL: webdriver should be false, got: $WD"
            FAIL=1
          fi
          if echo "$UA" | grep -q "Chrome"; then
            echo "  PASS: UA contains Chrome"
          elif [ "$UA" = "timeout" ]; then
            echo "  SKIP: fetch timed out (network issue)"
          else
            echo "  FAIL: UA should contain Chrome, got: $UA"
            FAIL=1
          fi
          if [ $FAIL -eq 0 ]; then echo "Stealth test PASSED"; else echo "FAILED"; exit 1; fi

      - name: Test real website - TeraBox
        shell: bash
        continue-on-error: true
        run: |
          BIN=target/aarch64-unknown-linux-gnu/release/obscura
          echo "=== TeraBox Test ==="
          TITLE=$(timeout 20 "$BIN" fetch -e 'document.title' https://terabox.com 2>/dev/null | tail -1 || echo "timeout")
          echo "  Title: $TITLE"
          LINKS=$(timeout 20 "$BIN" fetch --dump links https://terabox.com 2>/dev/null | grep -c "terabox.com" || echo "0")
          echo "  Links found: $LINKS"
          echo "TeraBox test completed"

      - name: Test real website - Voratoon
        shell: bash
        continue-on-error: true
        run: |
          BIN=target/aarch64-unknown-linux-gnu/release/obscura
          echo "=== Voratoon Test ==="
          TITLE=$(timeout 20 "$BIN" fetch -e 'document.title' https://v1.voratoon.com 2>/dev/null | tail -1 || echo "timeout")
          echo "  Title: $TITLE"
          echo "Voratoon test completed"

      - name: Test real website - YouTube
        shell: bash
        continue-on-error: true
        run: |
          BIN=target/aarch64-unknown-linux-gnu/release/obscura
          echo "=== YouTube Test ==="
          TITLE=$(timeout 20 "$BIN" fetch -e 'document.title' https://youtube.com 2>/dev/null | tail -1 || echo "timeout")
          echo "  Title: $TITLE"
          echo "YouTube test completed"

      - name: Test video element capabilities
        shell: bash
        continue-on-error: true
        run: |
          BIN=target/aarch64-unknown-linux-gnu/release/obscura
          echo "=== Video Element Test ==="
          VIDEO_ELEMENT=$(timeout 15 "$BIN" fetch -e 'typeof HTMLVideoElement' "data:text/html,<p>ok</p>" 2>/dev/null | tail -1 || echo "timeout")
          AUDIO_ELEMENT=$(timeout 15 "$BIN" fetch -e 'typeof HTMLAudioElement' "data:text/html,<p>ok</p>" 2>/dev/null | tail -1 || echo "timeout")
          MEDIA_SRC=$(timeout 15 "$BIN" fetch -e 'typeof MediaSource' "data:text/html,<p>ok</p>" 2>/dev/null | tail -1 || echo "timeout")
          echo "  HTMLVideoElement: $VIDEO_ELEMENT"
          echo "  HTMLAudioElement: $AUDIO_ELEMENT"
          echo "  MediaSource: $MEDIA_SRC"
          echo "Video element test completed"

      - name: Test screenshot on real site
        shell: bash
        continue-on-error: true
        run: |
          BIN=target/aarch64-unknown-linux-gnu/release/obscura
          timeout 20 "$BIN" fetch -s /tmp/terabox_test.png --wait 5 https://terabox.com 2>/dev/null || true
          if [ -f /tmp/terabox_test.png ]; then
            SIZE=$(stat -c%s /tmp/terabox_test.png)
            echo "TeraBox screenshot OK: ${SIZE} bytes"
          else
            echo "Screenshot skipped (network timeout)"
          fi

      - name: Test markdown dump on real site
        shell: bash
        continue-on-error: true
        run: |
          BIN=target/aarch64-unknown-linux-gnu/release/obscura
          MD=$(timeout 15 "$BIN" fetch --dump markdown https://example.com 2>/dev/null | head -5 || echo "timeout")
          echo "=== Markdown dump ==="
          echo "$MD"

      - name: Package binaries
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          BIN_DIR=target/aarch64-unknown-linux-gnu/release
          tar czf obscura-${VERSION}-aarch64-linux-full.tar.gz -C "$BIN_DIR" obscura obscura-worker

      - name: Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: obscura-linux-arm64-${{ github.run_id }}
          path: obscura-*-aarch64-linux*.tar.gz
          if-no-files-found: error
          retention-days: 30

  release:
    name: Release / Linux ARM64
    needs: build-arm64
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: obscura-linux-arm64-${{ github.run_id }}
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
