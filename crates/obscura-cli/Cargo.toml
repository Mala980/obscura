[package]
name = "obscura-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "obscura"
path = "src/main.rs"

[[bin]]
name = "obscura-worker"
path = "src/worker.rs"

[features]
default = []
stealth = ["obscura-browser/stealth", "obscura-net/stealth", "obscura-mcp/stealth"]
render = ["obscura-browser/render", "obscura-cdp/render", "obscura-mcp/render"]
websocket = ["obscura-js/websocket"]
canvas2d = ["obscura-js/canvas2d"]
media = ["obscura-js/media"]
webgl-gpu = ["obscura-js/webgl-gpu"]

[dependencies]
obscura-browser = { workspace = true }
obscura-mcp = { workspace = true }
obscura-cdp = { workspace = true }
obscura-dom = { workspace = true }
obscura-net = { workspace = true }
obscura-js = { workspace = true }
obscura-storage = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
url = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
