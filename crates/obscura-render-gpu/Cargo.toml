[package]
name = "obscura-render-gpu"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "GPU-accelerated rendering for Obscura using glow (OpenGL bindings)."

[features]
default = []
gpu = ["dep:glow", "dep:image", "dep:glutin", "dep:glutin-winit", "dep:winit", "dep:raw-window-handle"]

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
obscura-dom = { workspace = true }
obscura-render = { workspace = true }
# GPU rendering via glow (OpenGL bindings)
glow = { version = "0.16", optional = true }
image = { version = "0.25", optional = true }
# EGL / headless GL context via glutin
glutin = { version = "0.31", optional = true, default-features = false, features = ["egl", "x11"] }
glutin-winit = { version = "0.4", optional = true, default-features = false, features = ["egl", "x11"] }
winit = { version = "0.29", optional = true, default-features = false, features = ["x11", "rwh_04"] }
raw-window-handle = { version = "0.5", optional = true }
