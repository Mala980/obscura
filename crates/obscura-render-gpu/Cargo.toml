[package]
name = "obscura-render-gpu"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "GPU-accelerated rendering for Obscura using WebRender (servo parity)."

[features]
default = []
gpu = ["dep:glow", "dep:image"]

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
obscura-dom = { workspace = true }
obscura-render = { workspace = true }
# GPU rendering via glow (OpenGL bindings)
glow = { version = "0.16", optional = true }
image = { version = "0.25", optional = true }
